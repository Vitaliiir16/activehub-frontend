openapi: 3.1.1
info:
  title: ActiveHub REST API
  version: 0.1.0
  description: Contract foundation. Only GET /api/health is implemented. All other operations are planned and
    must not be treated as available. Q-01 through Q-05 remain open. See API_CONVENTIONS.md.
  license:
    name: Private project; no license granted
servers:
  - url: /
    description: Same-origin frontend proxy
tags:
  - name: Infrastructure
    description: Infrastructure operations.
  - name: Authentication
    description: Authentication operations.
  - name: Member
    description: Member operations.
  - name: Organizer
    description: Organizer operations.
  - name: Administration
    description: Administration operations.
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Infrastructure
      summary: Check API readiness
      description: Implemented. See API_CONVENTIONS.md and REQUIREMENTS.md for authorization and domain constraints.
      security: []
      x-implementation-status: implemented
      x-roles:
        - GUEST
        - USER
        - ORGANIZER
        - ADMIN
      x-ownership: Server must enforce role, account status and resource scope before returning data.
      responses:
        "200":
          description: Database and required migration are ready.
          headers:
            X-Request-ID:
              description: Correlation ID, generated by the server.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error503"
