openapi: 3.1.1
info:
  title: ActiveHub REST API
  version: 0.9.0
  description: Accounts, catalog, bookings, simulated payments, subscriptions, loyalty, communications (chat,
    reminders, email), administration (accounts, events, bookings, subscriptions, dictionaries), statistics
    and recommendations are implemented through stage 12; each operation declares its actual implementation
    status. Approved decisions are listed in x-decisions (Q-01 clamped reversal, Q-02 session month, Q-03
    inclusive cutoff, Q-04 corporate card until expiry). Q-05 remains open.
  license:
    name: Private project; no license granted
servers:
  - url: /
    description: Same-origin frontend proxy
tags:
  - name: Infrastructure
    description: Infrastructure operations.
  - name: Authentication
    description: Authentication operations.
  - name: Member
    description: Member operations.
  - name: Organizer
    description: Organizer operations.
  - name: Administration
    description: Administration operations.
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Infrastructure
      summary: Check API readiness
      description: Implemented. See API_CONVENTIONS.md and REQUIREMENTS.md for authorization and domain constraints.
      security: []
      x-implementation-status: implemented
      x-roles:
        - GUEST
        - USER
        - ORGANIZER
        - ADMIN
      x-ownership: Server must enforce role, account status and resource scope before returning data.
      responses:
        "200":
          description: Database and required migration are ready.
          headers:
            X-Request-ID:
              description: Correlation ID, generated by the server.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error503"
