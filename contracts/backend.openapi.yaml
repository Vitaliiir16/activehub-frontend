components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: activehub_session
      description: Planned opaque HTTP-only session cookie; seven-day default. No authentication is implemented yet.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Planned token bound to the pre-authentication or authenticated session; required for unsafe operations.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - database
      properties:
        status:
          const: ok
          type: string
        service:
          const: activehub-api
          type: string
        version:
          type: string
        database:
          const: ready
          type: string
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHENTICATED
                - FORBIDDEN
                - ACCOUNT_BLOCKED
                - NOT_FOUND
                - CONFLICT
                - IDEMPOTENCY_MISMATCH
                - REQUEST_IN_PROGRESS
                - VALIDATION_FAILED
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
            requestId:
              type: string
              format: uuid
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
