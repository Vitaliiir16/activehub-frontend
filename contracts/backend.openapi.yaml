            - requestId
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHENTICATED
                - FORBIDDEN
                - ACCOUNT_BLOCKED
                - NOT_FOUND
                - CONFLICT
                - IDEMPOTENCY_MISMATCH
                - REQUEST_IN_PROGRESS
                - VALIDATION_FAILED
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
